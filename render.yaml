services:
  - type: web
    name: always-awake-keeper
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PING_INTERVAL_MIN
        value: "5"
      - key: PING_TIMEOUT_MS
        value: "10000"
      - key: MAX_URLS
        value: "50"
      # Set after the first deploy (keeps this service awake as well):
      # - key: SELF_PING_URL
      #   value: https://YOUR-KEEPER.onrender.com
      # Seed URLs to keep awake (comma-separated, reloaded at boot):
      # - key: URLS
      #   value: https://your-backend-1.com,https://your-backend-2.com
      # Dashboard login credentials (defaults are built in — override here if needed):
      # - key: AUTH_USER
      #   value: YOUR_ID
      # - key: AUTH_PASS
      #   value: YOUR_PASSWORD
